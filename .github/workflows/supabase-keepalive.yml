name: Supabase keep-alive

# Free-tier Supabase-projecten pauzeren na ~7 dagen zonder activiteit.
# Deze job doet elke 3 dagen een REST-request (die de database raakt), zodat het
# project actief blijft. Let op: geplande workflows draaien alleen vanaf de
# default branch (main).
#
# De publishable key is bedoeld als publiek (hij zit ook in de app); RLS beschermt de data.
# Een 401 "permission denied" is hier dus verwacht en prima: de query is dan wel door Postgres gegaan.

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://wrwvvlqyglvirrhwutxy.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_jzl8jHabKBaRqFRJwnNMnw_oGde_GAE
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/exercises?select=id&limit=1")
          echo "HTTP $code"
          case "$code" in
            200|401|403) exit 0 ;;
            *) echo "Supabase onbereikbaar of gepauzeerd"; exit 1 ;;
          esac
